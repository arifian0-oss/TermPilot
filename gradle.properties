org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Sandbox quirk: JVMs here connect to daemons via IPv4-mapped IPv6
# (::ffff:127.0.0.1), which IPv4-only listeners reject. Run Kotlin
# compilation in-process (the Gradle daemon already forces IPv4).
kotlin.compiler.execution.strategy=in-process
